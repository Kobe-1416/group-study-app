services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: group_study
      POSTGRES_USER: group_study
      POSTGRES_PASSWORD: local_only_password
    ports:
      # Use 5433 on your laptop to avoid clashing with an existing PostgreSQL container on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U group_study -d group_study"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
